name: Bug report
description: Something in Tickmark doesn't work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran and the invoice or rulebook involved (no real customer data, please).
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant terminal output or the .kane/report.md section. Remove anything private.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "node -v, kane-cli --version, OS"
